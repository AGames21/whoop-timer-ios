name: Build iPhone companion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify captured frames and timer timing
        run: |
          swiftc ios/WhoopTimer/Puffin.swift ios/WhoopTimer/TimerStart.swift ios/ProtocolTests/main.swift -o "$RUNNER_TEMP/puffin-tests"
          "$RUNNER_TEMP/puffin-tests"
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/WhoopTimer.xcodeproj -scheme WhoopTimer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/whoop-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/whoop-build/Build/Products/Release-iphoneos/WhoopTimer.app"
          test -x "$app/WhoopTimer"
          test -s "$app/Assets.car"
          test -s "$app/Sounds/Native Burst.wav"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          payload="$RUNNER_TEMP/ipa/Payload/WhoopTimer.app"
          ditto "$app" "$payload"
          # Include a standalone icon at both iPhone scales for the sideloaded bundle.
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0' "$payload/Info.plist")
          source="ios/WhoopTimer/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          for scale in 2 3; do
            icon_file="$payload/${icon}@${scale}x.png"
            if [ ! -s "$icon_file" ]; then
              pixels=$((60 * scale))
              sips -z "$pixels" "$pixels" "$source" --out "$icon_file"
            fi
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/WhoopTimer-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: whoop-timer-iphone
          path: ${{ runner.temp }}/WhoopTimer-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
